<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif">
  <title>One square meter equals 10.764 square feet</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- 1 m square = 328px; 1 ft = 100px -->
  <rect x="80" y="60" width="328" height="328" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="180" y1="60" x2="180" y2="388"/><line x1="280" y1="60" x2="280" y2="388"/><line x1="380" y1="60" x2="380" y2="388"/>
    <line x1="80" y1="160" x2="408" y2="160"/><line x1="80" y1="260" x2="408" y2="260"/><line x1="80" y1="360" x2="408" y2="360"/>
  </g>
  <rect x="80" y="60" width="100" height="100" fill="#f59e0b" fill-opacity="0.45"/>
  <text x="130" y="116" font-size="16" fill="#0f172a" text-anchor="middle">1 sq ft</text>
  <text x="244" y="45" font-size="18" fill="#0f172a" text-anchor="middle">1 m = 3.28 ft</text>
  <text x="420" y="228" font-size="18" fill="#0f172a">1 m = 3.28 ft</text>
  <g font-size="18" fill="#0f172a">
    <text x="540" y="120" font-weight="bold">Length factor: 3.2808</text>
    <text x="540" y="170">Area: 3.2808 × 3.2808</text>
    <text x="540" y="200" font-weight="bold" fill="#0f766e">= 10.764 sq ft per m²</text>
    <text x="540" y="250">Volume: 3.2808³</text>
    <text x="540" y="280" font-weight="bold" fill="#0f766e">= 35.315 cu ft per m³</text>
  </g>
  <text x="80" y="425" font-size="16" fill="#0f172a">Grid squares are 1 ft; the 1 m square holds about 10.76 of them, not 3.28.</text>
</svg>
