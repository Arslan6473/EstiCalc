<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
  <title>Correct conversion versus rounding error</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <!-- correct: 13.78 x 11.81 ft at 22px/ft = 303 x 260 -->
  <rect x="60" y="70" width="303" height="260" fill="#0f766e" fill-opacity="0.2" stroke="#0f766e" stroke-width="3"/>
  <text x="211" y="55" font-size="18" fill="#0f172a" text-anchor="middle">4.2 m = 13.78 ft</text>
  <text x="211" y="190" font-size="18" fill="#0f172a" text-anchor="middle">3.6 m = 11.81 ft</text>
  <text x="211" y="220" font-size="20" fill="#0f766e" text-anchor="middle" font-weight="bold">15.12 m² = 162.8 sq ft</text>
  <text x="211" y="365" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="bold">Correct</text>
  <!-- rounded down: 13 x 11 ft = 286 x 242 inside 303 x 260 outline -->
  <rect x="500" y="70" width="303" height="260" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="500" y="70" width="286" height="242" fill="#f59e0b" fill-opacity="0.3" stroke="#b45309" stroke-width="3"/>
  <text x="643" y="55" font-size="18" fill="#0f172a" text-anchor="middle">Rounded to 13 ft</text>
  <text x="643" y="190" font-size="18" fill="#0f172a" text-anchor="middle">Rounded to 11 ft</text>
  <text x="643" y="220" font-size="20" fill="#b45309" text-anchor="middle" font-weight="bold">143 sq ft</text>
  <text x="651" y="365" font-size="18" fill="#b45309" text-anchor="middle" font-weight="bold">≈ 20 sq ft short</text>
</svg>
