  <rect x="440" y="60" width="300" height="240" fill="none" stroke="#0f172a" stroke-width="3"/>
  <g font-size="16" fill="#0f172a" text-anchor="middle">
    <text x="210" y="332">12 full tiles, 8 cut pieces;</text>
