  <title id="t">Straight versus diagonal tile layout waste</title>
  <desc id="d">The same area, about 4 feet 8 inches by 3 feet 9 inches, tiled with 12 inch tiles. Left: a straight grid where only the last row and last column are cut. Right: a diagonal layout where every tile touching an edge is cut at 45 degrees, 22 cut pieces against 8 full tiles.</desc>
