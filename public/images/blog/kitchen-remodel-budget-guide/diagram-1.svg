<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <title>Example 50,000 dollar kitchen budget allocation</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" fill="#0f172a" font-weight="bold">Example: $50,000 total = $42,500 working budget + $7,500 contingency</text>
  <g font-size="16" fill="#0f172a">
    <!-- scale: 1px = $40 ; max 12750 -> 318px -->
    <text x="40" y="92">Cabinets &amp; hardware</text>
    <rect x="290" y="76" width="319" height="22" fill="#0f766e"/><text x="620" y="92">$12,750</text>
    <text x="40" y="132">Labor &amp; installation</text>
    <rect x="290" y="116" width="213" height="22" fill="#0f766e"/><text x="514" y="132">$8,500</text>
    <text x="40" y="172">Appliances</text>
    <rect x="290" y="156" width="149" height="22" fill="#0f766e"/><text x="450" y="172">$5,950</text>
    <text x="40" y="212">Countertops</text>
    <rect x="290" y="196" width="128" height="22" fill="#0f766e"/><text x="428" y="212">$5,100</text>
    <text x="40" y="252">Flooring</text>
    <rect x="290" y="236" width="64" height="22" fill="#0f766e"/><text x="364" y="252">$2,550</text>
    <text x="40" y="292">Electrical &amp; lighting</text>
    <rect x="290" y="276" width="64" height="22" fill="#0f766e"/><text x="364" y="292">$2,550</text>
    <text x="40" y="332">Plumbing</text>
    <rect x="290" y="316" width="53" height="22" fill="#0f766e"/><text x="353" y="332">$2,125</text>
    <text x="40" y="372">Walls, paint, backsplash</text>
    <rect x="290" y="356" width="43" height="22" fill="#0f766e"/><text x="343" y="372">$1,700</text>
    <text x="40" y="412">Permits, design, disposal</text>
    <rect x="290" y="396" width="32" height="22" fill="#0f766e"/><text x="332" y="412">$1,275</text>
    <text x="40" y="460" font-weight="bold">Contingency (15%, kept separate)</text>
    <rect x="330" y="444" width="188" height="22" fill="#f59e0b"/><text x="528" y="460">$7,500</text>
  </g>
  <line x1="40" y1="430" x2="860" y2="430" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="505" font-size="16" fill="#0f766e">Illustrative allocation only — real splits come from your own quotes.</text>
</svg>
