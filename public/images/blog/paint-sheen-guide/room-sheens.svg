<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Typical sheen for each surface in a room</title>
  <desc id="d">Interior wall elevation: the ceiling is labelled flat, the wall eggshell, and the baseboard, door, door casing and window casing semi-gloss. A side panel notes satin for bathroom and kitchen walls.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <!-- ceiling band -->
  <rect x="40" y="30" width="560" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="320" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ceiling — flat</text>
  <!-- wall -->
  <rect x="40" y="80" width="560" height="290" fill="#ccfbf1" stroke="#0f172a" stroke-width="2"/>
  <text x="240" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Walls — eggshell</text>
  <text x="240" y="152" text-anchor="middle" font-size="16" fill="#0f172a">(or washable matte)</text>
  <!-- window with casing -->
  <rect x="100" y="180" width="140" height="110" fill="#ffffff" stroke="#f59e0b" stroke-width="10"/>
  <line x1="170" y1="180" x2="170" y2="290" stroke="#e2e8f0" stroke-width="3"/>
  <!-- door with casing -->
  <rect x="400" y="140" width="120" height="216" fill="#fef3c7" stroke="#f59e0b" stroke-width="10"/>
  <circle cx="500" cy="254" r="6" fill="#0f172a"/>
  <!-- baseboard -->
  <rect x="40" y="356" width="560" height="14" fill="#f59e0b"/>
  <!-- labels -->
  <g font-size="16" fill="#0f172a">
    <text x="170" y="316" text-anchor="middle">window casing</text>
    <text x="460" y="128" text-anchor="middle">door + casing</text>
    <text x="320" y="398" text-anchor="middle">baseboard</text>
  </g>
  <rect x="620" y="140" width="22" height="22" fill="#f59e0b"/>
  <text x="652" y="158" font-size="17" font-weight="700" fill="#b45309">= semi-gloss</text>
  <g font-size="16" fill="#0f172a">
    <text x="620" y="210" font-weight="700">Bathroom or</text>
    <text x="620" y="230" font-weight="700">kitchen walls:</text>
    <text x="620" y="252">satin</text>
    <text x="620" y="292" font-weight="700">Cabinets:</text>
    <text x="620" y="314">semi-gloss or</text>
    <text x="620" y="334">satin enamel</text>
  </g>
</svg>
