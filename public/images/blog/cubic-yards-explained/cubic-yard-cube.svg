<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">One cubic yard equals 27 cubic feet</title>
  <desc id="d">An isometric cube 3 feet on each side, divided into a 3 by 3 by 3 grid of one-foot cubes, with the equation 3 ft times 3 ft times 3 ft equals 27 cubic feet equals 1 cubic yard.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <!-- cube: front face square 210px at (90,150); depth offset (90,-60) -->
  <polygon points="90,150 300,150 390,90 180,90" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <polygon points="300,150 390,90 390,300 300,360" fill="#99f6e4" stroke="#0f766e" stroke-width="3"/>
  <rect x="90" y="150" width="210" height="210" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <g stroke="#0f766e" stroke-width="1.5">
    <!-- front grid -->
    <line x1="160" y1="150" x2="160" y2="360"/>
    <line x1="230" y1="150" x2="230" y2="360"/>
    <line x1="90" y1="220" x2="300" y2="220"/>
    <line x1="90" y1="290" x2="300" y2="290"/>
    <!-- top grid -->
    <line x1="160" y1="150" x2="250" y2="90"/>
    <line x1="230" y1="150" x2="320" y2="90"/>
    <line x1="120" y1="130" x2="330" y2="130"/>
    <line x1="150" y1="110" x2="360" y2="110"/>
    <!-- side grid -->
    <line x1="330" y1="130" x2="330" y2="340"/>
    <line x1="360" y1="110" x2="360" y2="320"/>
    <line x1="300" y1="220" x2="390" y2="160"/>
    <line x1="300" y1="290" x2="390" y2="230"/>
  </g>
  <text x="195" y="390" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3 ft</text>
  <text x="66" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3 ft</text>
  <text x="372" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3 ft</text>
  <g fill="#0f172a">
    <text x="450" y="160" font-size="22" font-weight="700">3 × 3 × 3 = 27 cu ft</text>
    <text x="450" y="200" font-size="22" font-weight="700" fill="#0f766e">= 1 cubic yard</text>
    <text x="450" y="250" font-size="17">Each small cube is 1 cu ft.</text>
    <text x="450" y="278" font-size="17">Cubic yards = cubic feet ÷ 27</text>
    <text x="450" y="320" font-size="17">1 cu yd = 13.5 bags of 2 cu ft</text>
    <text x="450" y="348" font-size="17">1 cu yd ≈ 0.76 cubic metres</text>
  </g>
</svg>
