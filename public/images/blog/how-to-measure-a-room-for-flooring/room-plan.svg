<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Measuring a bedroom for flooring</title>
  <desc id="d">Plan view of a 12 foot 9 inch by 11 foot 4 inch bedroom with a 6 by 2 foot closet along the top wall, a 32 inch doorway measured to the centre of the door, and two dashed diagonals used to check that the room is square.</desc>
  <rect width="800" height="480" fill="#ffffff"/>
  <!-- scale 26px/ft. Room 12.75 x 11.33 => 331.5 x 294.6 ; origin (120,110) -->
  <rect x="120" y="110" width="332" height="295" fill="#f0fdfa" stroke="#0f172a" stroke-width="4"/>
  <!-- closet 6x2 above room top wall => 156 x 52, at x=200 -->
  <rect x="200" y="58" width="156" height="52" fill="#fef3c7" stroke="#0f172a" stroke-width="4"/>
  <line x1="200" y1="110" x2="356" y2="110" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="278" y="90" text-anchor="middle" font-size="16" fill="#0f172a">closet 6 × 2 ft</text>
  <!-- doorway on right wall: 32in => 69px, y 300..369 -->
  <rect x="446" y="300" width="18" height="69" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <line x1="455" y1="300" x2="455" y2="369" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- diagonals -->
  <line x1="120" y1="110" x2="452" y2="405" stroke="#0f766e" stroke-width="2" stroke-dasharray="10 6"/>
  <line x1="452" y1="110" x2="120" y2="405" stroke="#0f766e" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="286" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Bedroom</text>
  <text x="286" y="274" text-anchor="middle" font-size="16" fill="#0f172a">12.75 × 11.33 = 144.5 sq ft</text>
  <!-- width dim -->
  <line x1="120" y1="430" x2="452" y2="430" stroke="#0f766e" stroke-width="2"/>
  <line x1="120" y1="422" x2="120" y2="438" stroke="#0f766e" stroke-width="2"/>
  <line x1="452" y1="422" x2="452" y2="438" stroke="#0f766e" stroke-width="2"/>
  <text x="286" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">12 ft 9 in (12.75 ft)</text>
  <!-- height dim -->
  <line x1="90" y1="110" x2="90" y2="405" stroke="#0f766e" stroke-width="2"/>
  <line x1="82" y1="110" x2="98" y2="110" stroke="#0f766e" stroke-width="2"/>
  <line x1="82" y1="405" x2="98" y2="405" stroke="#0f766e" stroke-width="2"/>
  <text x="70" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e" transform="rotate(-90 70 258)">11 ft 4 in (11.33 ft)</text>
  <!-- callouts -->
  <g font-size="16" fill="#0f172a">
    <text x="490" y="128" font-weight="700">Measure twice per wall</text>
    <text x="490" y="150">Use the larger figure if</text>
    <text x="490" y="170">the two readings differ.</text>
    <text x="490" y="218" font-weight="700" fill="#0f766e">Diagonals equal = square</text>
    <text x="490" y="240">Differ by more than ½ in?</text>
    <text x="490" y="260">Expect tapered rows and</text>
    <text x="490" y="280">use a higher waste %.</text>
    <text x="490" y="328" font-weight="700" fill="#b45309">Doorway (32 in)</text>
    <text x="490" y="350">Floor runs to the centre</text>
    <text x="490" y="370">of the closed door, where</text>
    <text x="490" y="390">the transition strip sits.</text>
  </g>
</svg>
