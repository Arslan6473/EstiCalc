<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <title>Plan of a 5 by 8 foot bathroom with tile areas</title>
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- room 5 ft wide (250px) x 8 ft long (400px); 50px per foot -->
  <rect x="100" y="60" width="250" height="400" fill="#0f766e" fill-opacity="0.12" stroke="#0f172a" stroke-width="5"/>
  <!-- tub along back wall: 5 ft x 2.5 ft -->
  <rect x="100" y="60" width="250" height="125" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <rect x="115" y="75" width="220" height="95" rx="40" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="225" y="128" font-size="16" fill="#0f172a" text-anchor="middle">Tub 60 × 30 in</text>
  <!-- surround walls highlighted -->
  <line x1="100" y1="60" x2="350" y2="60" stroke="#f59e0b" stroke-width="10"/>
  <line x1="100" y1="60" x2="100" y2="185" stroke="#f59e0b" stroke-width="10"/>
  <line x1="350" y1="60" x2="350" y2="185" stroke="#f59e0b" stroke-width="10"/>
  <!-- toilet -->
  <rect x="300" y="215" width="40" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="295" cy="230" rx="30" ry="20" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="250" y="270" font-size="16" fill="#0f172a">Toilet</text>
  <!-- vanity -->
  <rect x="290" y="300" width="60" height="75" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="215" y="345" font-size="16" fill="#0f172a">Vanity 30 in</text>
  <!-- door -->
  <line x1="150" y1="460" x2="250" y2="460" stroke="#ffffff" stroke-width="6"/>
  <path d="M150 460 A100 100 0 0 1 250 360" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="490" font-size="16" fill="#0f172a" text-anchor="middle">Door</text>
  <!-- dimensions -->
  <text x="225" y="45" font-size="18" fill="#0f172a" text-anchor="middle">5 ft</text>
  <text x="60" y="270" font-size="18" fill="#0f172a">8 ft</text>
  <!-- legend & math -->
  <rect x="420" y="70" width="24" height="24" fill="#0f766e" fill-opacity="0.25" stroke="#0f172a"/>
  <text x="456" y="89" font-size="16" fill="#0f172a">Floor tile: 40 − 12.5 = 27.5 sq ft</text>
  <text x="456" y="113" font-size="16" fill="#0f172a">+10% waste ≈ 30 sq ft</text>
  <rect x="420" y="150" width="24" height="10" fill="#f59e0b"/>
  <text x="456" y="162" font-size="16" fill="#0f172a">Surround: (5 + 2.5 + 2.5) ft × 6 ft</text>
  <text x="456" y="186" font-size="16" fill="#0f172a">= 60 sq ft, +10–15% ≈ 66–69 sq ft</text>
  <text x="420" y="250" font-size="18" fill="#0f766e" font-weight="bold">Same layout = no drain moves</text>
  <text x="420" y="276" font-size="16" fill="#0f172a">Keeping the tub, toilet and vanity</text>
  <text x="420" y="298" font-size="16" fill="#0f172a">in place avoids new drains and vents.</text>
</svg>
