<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Post layout for an L-shaped fence</title>
  <desc id="d">Plan view of a fence with a 60 foot run divided into 8 sections of 7.5 feet (9 posts including the corner) and a 40 foot run with 36 feet of fence in 5 sections of 7.2 feet plus a 4 foot gate, adding 6 more posts. Total 15 posts.</desc>
  <rect width="800" height="440" fill="#ffffff"/>
  <!-- scale 9px/ft: run A 540px, run B 360px -->
  <line x1="80" y1="70" x2="620" y2="70" stroke="#0f766e" stroke-width="4"/>
  <!-- run B: 36ft fence = 324px from y=70 to 394, then gate 4ft=36px to 430 -->
  <line x1="620" y1="70" x2="620" y2="394" stroke="#0f766e" stroke-width="4"/>
  <line x1="620" y1="394" x2="620" y2="430" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 4"/>
  <!-- posts run A: 9 posts every 67.5px -->
  <g fill="#0f172a">
    <rect x="74" y="64" width="12" height="12"/>
    <rect x="141.5" y="64" width="12" height="12"/>
    <rect x="209" y="64" width="12" height="12"/>
    <rect x="276.5" y="64" width="12" height="12"/>
    <rect x="344" y="64" width="12" height="12"/>
    <rect x="411.5" y="64" width="12" height="12"/>
    <rect x="479" y="64" width="12" height="12"/>
    <rect x="546.5" y="64" width="12" height="12"/>
    <rect x="614" y="64" width="12" height="12"/>
    <!-- run B posts every 64.8px from y=70: 134.8, 199.6, 264.4, 329.2, 394 -->
    <rect x="614" y="128.8" width="12" height="12"/>
    <rect x="614" y="193.6" width="12" height="12"/>
    <rect x="614" y="258.4" width="12" height="12"/>
    <rect x="614" y="323.2" width="12" height="12"/>
  </g>
  <!-- gate posts -->
  <rect x="612" y="386" width="16" height="16" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
  <rect x="612" y="422" width="16" height="16" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Run A: 60 ft → 8 sections × 7.5 ft → 9 posts</text>
  <text x="600" y="190" text-anchor="end" font-size="18" font-weight="700" fill="#0f172a">Run B: 36 ft fence</text>
  <text x="600" y="214" text-anchor="end" font-size="17" fill="#0f172a">5 sections × 7.2 ft</text>
  <text x="600" y="238" text-anchor="end" font-size="17" fill="#0f172a">+5 posts (corner shared)</text>
  <text x="640" y="418" font-size="17" font-weight="700" fill="#b45309">4 ft gate</text>
  <text x="600" y="400" text-anchor="end" font-size="16" fill="#0f172a">gate posts (+1 extra)</text>
  <g font-size="17" fill="#0f172a">
    <text x="80" y="300" font-weight="700">Total: 9 + 5 + 1 = 15 posts</text>
    <text x="80" y="326">13 sections × 3 rails = 39 rails</text>
    <text x="80" y="352">Corner post counted once</text>
  </g>
</svg>
