<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">
  <title>Backsplash measured in three sections</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <!-- upper cabinets -->
  <rect x="40" y="40" width="340" height="110" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <rect x="580" y="40" width="280" height="110" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="210" y="100" font-size="16" fill="#0f172a" text-anchor="middle">Upper cabinets</text>
  <text x="720" y="100" font-size="16" fill="#0f172a" text-anchor="middle">Upper cabinets</text>
  <!-- hood -->
  <polygon points="400,40 560,40 540,110 420,110" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="85" font-size="16" fill="#0f172a" text-anchor="middle">Hood</text>
  <!-- section A -->
  <rect x="40" y="150" width="340" height="130" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="3"/>
  <text x="210" y="210" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">A: 96 × 18 in</text>
  <text x="210" y="236" font-size="16" fill="#0f172a" text-anchor="middle">= 12.0 sq ft</text>
  <!-- section B range panel -->
  <rect x="400" y="110" width="160" height="170" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="3"/>
  <text x="480" y="185" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">B: 30 × 36 in</text>
  <text x="480" y="211" font-size="16" fill="#0f172a" text-anchor="middle">= 7.5 sq ft</text>
  <!-- section C with window -->
  <rect x="580" y="150" width="280" height="130" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="3"/>
  <rect x="660" y="160" width="140" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="730" y="196" font-size="16" fill="#0f172a" text-anchor="middle">Window 36 × 12</text>
  <text x="720" y="250" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">C: 60 × 18 in</text>
  <text x="720" y="272" font-size="16" fill="#0f172a" text-anchor="middle">7.5 − 3.0 = 4.5 sq ft</text>
  <!-- outlets -->
  <rect x="120" y="200" width="18" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="300" y="200" width="18" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <!-- countertop -->
  <rect x="40" y="280" width="820" height="26" fill="#0f172a"/>
  <text x="450" y="298" font-size="16" fill="#ffffff" text-anchor="middle">Countertop</text>
  <!-- summary -->
  <text x="40" y="350" font-size="18" fill="#0f172a">Net area: 12.0 + 7.5 + 4.5 = 24.0 sq ft</text>
  <text x="40" y="380" font-size="18" fill="#0f172a">With 10% waste: 24.0 × 1.10 = 26.4 sq ft to buy</text>
  <text x="40" y="420" font-size="16" fill="#0f766e">Outlets (small white boxes) are not subtracted — they create extra cuts.</text>
</svg>
