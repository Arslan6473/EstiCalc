<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <title>Roof pitch triangle for a 6 in 12 roof</title>
  <rect width="900" height="420" fill="#ffffff"/>
  <!-- triangle: run 12 in = 480px, rise 6 in = 240px -->
  <polygon points="80,340 560,340 560,100" fill="#0f766e" fill-opacity="0.12" stroke="#0f172a" stroke-width="3"/>
  <line x1="80" y1="340" x2="560" y2="100" stroke="#f59e0b" stroke-width="6"/>
  <rect x="536" y="316" width="24" height="24" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="320" y="374" font-size="18" fill="#0f172a" text-anchor="middle">Run = 12 in</text>
  <text x="575" y="226" font-size="18" fill="#0f172a">Rise = 6 in</text>
  <text x="250" y="200" font-size="18" fill="#0f172a" font-weight="bold" transform="rotate(-26.6 250 200)">Slope = 13.42 in</text>
  <text x="140" y="330" font-size="16" fill="#0f172a">26.6°</text>
  <!-- formula panel -->
  <text x="640" y="80" font-size="18" fill="#0f172a" font-weight="bold">6/12 pitch</text>
  <text x="640" y="120" font-size="16" fill="#0f172a">√(12² + 6²)</text>
  <text x="640" y="144" font-size="16" fill="#0f172a">= √180 = 13.42</text>
  <text x="640" y="184" font-size="16" fill="#0f172a">Multiplier</text>
  <text x="640" y="208" font-size="16" fill="#0f172a">= 13.42 ÷ 12</text>
  <text x="640" y="244" font-size="22" fill="#0f766e" font-weight="bold">= 1.118</text>
  <text x="80" y="405" font-size="16" fill="#0f172a">Roof surface = footprint (with overhangs) × multiplier</text>
</svg>
