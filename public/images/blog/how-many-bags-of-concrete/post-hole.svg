<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Fence post hole cross-section</title>
  <desc id="d">A hole 10 inches in diameter and 36 inches deep. The bottom 6 inches is gravel for drainage. A 4 by 4 post (3.5 inches actual) stands on the gravel and is surrounded by 30 inches of concrete, crowned slightly above grade so water runs away from the post.</desc>
  <rect width="800" height="460" fill="#ffffff"/>
  <!-- ground line y=110 ; scale 9px per inch. hole 10in = 90px wide centered x=260 => 215..305 ; depth 36in = 324 => bottom y=434 -->
  <rect x="40" y="110" width="440" height="340" fill="#f5efe6"/>
  <line x1="40" y1="110" x2="480" y2="110" stroke="#0f172a" stroke-width="3"/>
  <text x="56" y="100" font-size="16" fill="#0f172a">grade</text>
  <!-- hole -->
  <rect x="215" y="110" width="90" height="324" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <!-- gravel 6in = 54px -->
  <rect x="215" y="380" width="90" height="54" fill="#cbd5e1"/>
  <g fill="#94a3b8"><circle cx="228" cy="396" r="5"/><circle cx="250" cy="414" r="6"/><circle cx="276" cy="398" r="5"/><circle cx="295" cy="420" r="5"/><circle cx="240" cy="426" r="4"/><circle cx="268" cy="424" r="5"/></g>
  <!-- concrete 30in = 270px from y=110 to 380 -->
  <polygon points="215,380 305,380 305,110 300,104 260,96 220,104 215,110" fill="#e2e8f0" stroke="#0f766e" stroke-width="2"/>
  <!-- post 3.5in = 31.5px centered => 244..276, from y=20 to 380 -->
  <rect x="244" y="20" width="32" height="360" fill="#d6a76c" stroke="#0f172a" stroke-width="2"/>
  <!-- dims -->
  <line x1="215" y1="446" x2="305" y2="446" stroke="#0f766e" stroke-width="2"/>
  <line x1="510" y1="110" x2="510" y2="434" stroke="#0f766e" stroke-width="2"/>
  <line x1="502" y1="110" x2="518" y2="110" stroke="#0f766e" stroke-width="2"/>
  <line x1="502" y1="434" x2="518" y2="434" stroke="#0f766e" stroke-width="2"/>
  <line x1="502" y1="380" x2="518" y2="380" stroke="#0f766e" stroke-width="2"/>
  <g font-size="17" fill="#0f172a">
    <text x="530" y="250" font-weight="700" fill="#0f766e">30 in concrete</text>
    <text x="530" y="412" font-weight="700" fill="#0f766e">6 in gravel</text>
    <text x="530" y="60" font-weight="700">36 in deep hole</text>
    <text x="530" y="84">10 in diameter</text>
    <text x="530" y="140">Crown concrete above</text>
    <text x="530" y="162">grade to shed water</text>
    <text x="530" y="300">4×4 post (3.5 × 3.5 in)</text>
    <text x="530" y="332">≈ 1.15 cu ft concrete</text>
    <text x="530" y="356">≈ 2 × 80 lb bags</text>
  </g>
  <text x="168" y="250" text-anchor="end" font-size="16" fill="#0f172a">concrete</text>
  <line x1="172" y1="245" x2="222" y2="245" stroke="#0f172a" stroke-width="1.5"/>
  <text x="168" y="410" text-anchor="end" font-size="16" fill="#0f172a">gravel</text>
  <line x1="172" y1="405" x2="222" y2="405" stroke="#0f172a" stroke-width="1.5"/>
  <text x="260" y="14" text-anchor="middle" font-size="16" fill="#0f172a">post</text>
</svg>
