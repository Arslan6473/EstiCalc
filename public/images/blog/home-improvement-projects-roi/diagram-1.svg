<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif">
  <title>Three kinds of return weighed against project cost</title>
  <rect width="900" height="440" fill="#ffffff"/>
  <!-- fulcrum -->
  <polygon points="450,330 410,400 490,400" fill="#0f172a"/>
  <line x1="120" y1="320" x2="780" y2="320" stroke="#0f172a" stroke-width="6"/>
  <!-- left pan: cost -->
  <rect x="140" y="220" width="200" height="100" rx="8" fill="#f59e0b" fill-opacity="0.35" stroke="#b45309" stroke-width="2"/>
  <text x="240" y="262" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">Project cost</text>
  <text x="240" y="290" font-size="16" fill="#0f172a" text-anchor="middle">+ permits, contingency,</text>
  <text x="240" y="310" font-size="16" fill="#0f172a" text-anchor="middle">financing</text>
  <!-- right pan: three blocks stacked -->
  <rect x="560" y="250" width="200" height="66" rx="6" fill="#0f766e" fill-opacity="0.85"/>
  <text x="660" y="280" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Resale value</text>
  <text x="660" y="302" font-size="16" fill="#ffffff" text-anchor="middle">added at sale</text>
  <rect x="560" y="178" width="200" height="66" rx="6" fill="#0f766e" fill-opacity="0.6"/>
  <text x="660" y="208" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Money saved</text>
  <text x="660" y="230" font-size="16" fill="#0f172a" text-anchor="middle">energy, avoided repairs</text>
  <rect x="560" y="106" width="200" height="66" rx="6" fill="#0f766e" fill-opacity="0.3"/>
  <text x="660" y="136" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="bold">Use and enjoyment</text>
  <text x="660" y="158" font-size="16" fill="#0f172a" text-anchor="middle">years of daily benefit</text>
  <text x="450" y="50" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">Cost recovered = value increase ÷ cost × 100</text>
  <text x="450" y="80" font-size="16" fill="#0f172a" text-anchor="middle">A full picture also weighs savings and how long you'll live with the project.</text>
  <text x="450" y="430" font-size="16" fill="#0f172a" text-anchor="middle">Most projects recover only part of their cost at resale.</text>
</svg>
