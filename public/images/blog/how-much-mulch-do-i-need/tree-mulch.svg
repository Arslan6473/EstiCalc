<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Mulch volcano versus correct mulch ring</title>
  <desc id="d">Left, marked wrong: mulch piled high against the tree trunk in a cone. Right, marked right: a flat layer of mulch 2 to 3 inches deep, spread wide, with a few inches of clear space around the trunk flare.</desc>
  <rect width="800" height="380" fill="#ffffff"/>
  <!-- ground -->
  <rect x="20" y="280" width="760" height="80" fill="#f5efe6"/>
  <line x1="20" y1="280" x2="780" y2="280" stroke="#0f172a" stroke-width="2"/>
  <!-- left tree -->
  <rect x="186" y="80" width="28" height="200" fill="#7c4a1e"/>
  <circle cx="200" cy="80" r="60" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <polygon points="90,280 200,170 310,280" fill="#c08457" stroke="#7c4a1e" stroke-width="2"/>
  <text x="200" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#b91c1c">✗ Mulch volcano</text>
  <text x="200" y="318" text-anchor="middle" font-size="16" fill="#0f172a">Piled deep against bark,</text>
  <text x="200" y="340" text-anchor="middle" font-size="16" fill="#0f172a">holding moisture on the trunk</text>
  <!-- right tree -->
  <path d="M 586 280 C 586 268, 592 262, 592 240 L 592 80 L 608 80 L 608 240 C 608 262, 614 268, 614 280 Z" fill="#7c4a1e"/>
  <circle cx="600" cy="80" r="60" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
  <rect x="440" y="250" width="134" height="30" fill="#c08457" stroke="#7c4a1e" stroke-width="2"/>
  <rect x="626" y="250" width="134" height="30" fill="#c08457" stroke="#7c4a1e" stroke-width="2"/>
  <text x="600" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">✓ Flat ring</text>
  <line x1="770" y1="250" x2="770" y2="280" stroke="#0f766e" stroke-width="2"/>
  <text x="764" y="240" text-anchor="end" font-size="16" fill="#0f766e">2–3 in deep</text>
  <text x="600" y="318" text-anchor="middle" font-size="16" fill="#0f172a">Gap of a few inches at the trunk flare;</text>
  <text x="600" y="340" text-anchor="middle" font-size="16" fill="#0f172a">spread wide, ideally toward the drip line</text>
</svg>
