<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Measuring mulch beds in a front yard</title>
  <desc id="d">A house with a 40 by 5 foot foundation bed of 200 square feet, a curved island bed about 12 feet long with an average width of 6 feet (72 square feet), and two tree rings 6 feet in diameter (28.3 square feet each). Total 328.6 square feet.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <!-- house -->
  <rect x="80" y="20" width="640" height="60" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="400" y="56" text-anchor="middle" font-size="18" fill="#0f172a">house</text>
  <!-- foundation bed 40 x 5 ft at 16px/ft = 640 x 80 -->
  <rect x="80" y="80" width="640" height="80" fill="#c08457" fill-opacity="0.55" stroke="#0f766e" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Foundation bed 40 × 5 ft = 200 sq ft</text>
  <text x="400" y="142" text-anchor="middle" font-size="16" fill="#0f172a">5 ft deep from the wall</text>
  <!-- island bed: 12ft=192px long, avg width 6ft=96px -->
  <path d="M 120 300 C 120 230, 200 220, 260 236 C 320 252, 330 260, 312 300 C 296 350, 230 360, 180 352 C 136 346, 120 330, 120 300 Z" fill="#c08457" fill-opacity="0.55" stroke="#0f766e" stroke-width="2"/>
  <line x1="120" y1="300" x2="312" y2="300" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="216" y="292" text-anchor="middle" font-size="16" fill="#0f172a">12 ft long</text>
  <text x="216" y="330" text-anchor="middle" font-size="16" fill="#0f172a">avg width 6 ft</text>
  <text x="216" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Island bed ≈ 72 sq ft</text>
  <!-- tree rings 6ft dia => 96px -->
  <circle cx="470" cy="290" r="48" fill="#c08457" fill-opacity="0.55" stroke="#0f766e" stroke-width="2"/>
  <circle cx="470" cy="290" r="8" fill="#7c4a1e"/>
  <line x1="470" y1="290" x2="518" y2="290" stroke="#f59e0b" stroke-width="3"/>
  <text x="494" y="282" text-anchor="middle" font-size="16" fill="#0f172a">3 ft</text>
  <circle cx="640" cy="290" r="48" fill="#c08457" fill-opacity="0.55" stroke="#0f766e" stroke-width="2"/>
  <circle cx="640" cy="290" r="8" fill="#7c4a1e"/>
  <text x="555" y="372" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Tree rings: 3.1416 × 3² = 28.3 sq ft each</text>
  <text x="555" y="404" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">Total ≈ 328.6 sq ft</text>
</svg>
